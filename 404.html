<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>404 坐标未找到 | Sevenseven</title>
    <style>
      :root {
        --ink: #121a36;
        --paper: #f7f9ff;
        --blue: #173fee;
        --orange: #ff6a3d;
        --white: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eef2ff;
          --paper: #090d18;
          --blue: #3b66ff;
          --orange: #ff7849;
          --white: #10172a;
        }
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: var(--ink);
        background:
          linear-gradient(rgba(23, 63, 238, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 63, 238, 0.04) 1px, transparent 1px),
          var(--paper);
        background-size: 32px 32px;
        font-family: "Microsoft YaHei UI", -apple-system, sans-serif;
        padding: 20px;
      }
      main {
        width: min(580px, 100%);
        padding: clamp(32px, 6vw, 48px);
        border: 2px solid var(--ink);
        background: var(--white);
        box-shadow: 8px 8px 0 var(--blue);
      }
      strong {
        display: block;
        color: var(--blue);
        font: 900 clamp(72px, 18vw, 130px)/0.85 Impact, sans-serif;
        letter-spacing: -0.05em;
      }
      h1 { margin: 24px 0 12px; font-size: clamp(22px, 4vw, 28px); font-weight: 850; }
      p { margin: 0 0 28px; opacity: 0.8; font-size: 15px; line-height: 1.7; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        color: #ffffff;
        background: var(--blue);
        border: 2px solid var(--ink);
        font-weight: 800;
        font-size: 14.5px;
        text-decoration: none;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--ink);
      }
      a:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <strong>404</strong>
      <h1>此坐标暂时没有内容</h1>
      <p>你访问的路径可能已迁移、更新，或者该实验项目仍在本地孵化中。</p>
      <a href="/">← 返回 Sevenseven 首页</a>
    </main>
  </body>
</html>
