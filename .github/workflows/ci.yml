name: Site Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate HTML, Metadata & PWA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Files & JSON
        run: |
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); console.log('✓ Manifest valid:', manifest.name); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('<!doctype html>')) throw new Error('Invalid HTML'); console.log('✓ HTML valid (bytes: ' + html.length + ')');"

